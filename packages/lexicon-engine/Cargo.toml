[workspace]
members = [
    "core",
    "wasm",
    "grep",
    "vendor/grep-matcher",
    "vendor/grep-regex",
    "vendor/grep-searcher",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
# Optimize for size and performance
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"